# ==============================================================================
# 分流匹配顺序（严格自上而下，顺序不可随意颠倒！）
# ==============================================================================
rules:
  # --- [第 1 层] 本地回环与局域网直连（保护 Antigravity 本地 gRPC 语言服务器与浏览器调试端口） ---
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 可选：若某些机场节点对 UDP 443 (QUIC/HTTP3) 支持不佳导致 Antigravity / Gemini 偶发卡顿，可取消下一行注释：
  # - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # --- [第 2 层] Google Antigravity 最高优先级独立分流（必须先于 google_deepmind 与 google） ---
  - RULE-SET,custom_google_antigravity,🌌 Google Antigravity

  # --- [第 3 层] Google AI 生态详细分流（Gemini / AI Studio / NotebookLM / Jules / Vertex AI） ---
  - RULE-SET,custom_google_ai,✨ Google AI
  - RULE-SET,google_deepmind,✨ Google AI

  # --- [第 4 层] Google 核心账号鉴权与区域校验保护（防掉入香港大流量或被 @cn 误直连） ---
  - RULE-SET,custom_google_auth,🔍 Google 服务

  # --- [第 5 层] 全网大流量下载、HF 模型、容器镜像、包管理器与 Google 下载/视频剥离 ---
  # （排在 category_ai_not_cn、google_domain、github、cn_domain 之前，确保下模型/看 4K 全部走大流量节点！）
  - RULE-SET,huggingface,⬇️ 下载专用
  - RULE-SET,custom_downloads,⬇️ 下载专用
  - RULE-SET,kaggle,⬇️ 下载专用
  - RULE-SET,docker,⬇️ 下载专用
  - RULE-SET,youtube,⬇️ 下载专用
  # Steam 先放行国内 CDN 直连跑满本地宽带，海外 Steam 下载走下载专用（大流量）
  - RULE-SET,steam_cn,🎯 全球直连
  - RULE-SET,steam,⬇️ 下载专用

  # --- [第 6 层] 各大海外 AI 服务精细独立分流 ---
  # Claude (Anthropic / Claude Code / MCP)
  - RULE-SET,custom_claude,🟠 Claude
  - RULE-SET,anthropic,🟠 Claude

  # OpenAI (ChatGPT / Sora / API / LiveKit 语音)
  - RULE-SET,custom_openai,🟢 OpenAI
  - RULE-SET,openai,🟢 OpenAI

  # AI 编程助手 (Cursor / Windsurf / GitHub Copilot / JetBrains AI / CodeRabbit)
  - RULE-SET,custom_ai_coding,💻 AI 编程
  - RULE-SET,cursor,💻 AI 编程
  - RULE-SET,windsurf,💻 AI 编程
  - RULE-SET,github_copilot,💻 AI 编程
  - RULE-SET,jetbrains_ai,💻 AI 编程

  # 其他主流 AI 服务 (xAI Grok / Perplexity / OpenRouter / Poe / Groq / Midjourney 等长尾兜底)
  # 注：因 HuggingFace / Ollama 已在第 5 层提前走【⬇️ 下载专用】，此处 category_ai_not_cn 不会抢占模型下载流量！
  - RULE-SET,xai,🤖 其他 AI
  - RULE-SET,perplexity,🤖 其他 AI
  - RULE-SET,custom_ai_others,🤖 其他 AI
  - RULE-SET,category_ai_not_cn,🤖 其他 AI

  # --- [第 7 层] Google 其余所有服务与 IP 隔离（排在 cn_domain 之前，杜绝 google@cn 直连泄露国内 IP！） ---
  - RULE-SET,google_domain,🔍 Google 服务
  - RULE-SET,google_ip,🔍 Google 服务,no-resolve

  # --- [第 8 层] 国内常见服务直连（Apple / Microsoft 国内 CDN / 大陆域名） ---
  - RULE-SET,apple_cn,🎯 全球直连
  - RULE-SET,microsoft_cn,🎯 全球直连
  - RULE-SET,cn_domain,🎯 全球直连

