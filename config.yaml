# ==============================================================================
# Mihomo (Clash Meta) 精细化 AI 隔离 + 大流量下载分流配置
# 核心设计目标：
#   1. 国外常规流量 & 全网下载（HuggingFace/模型/镜像/包管理/视频流） -> 📦 大流量节点
#   2. 各大 AI 服务精细独立分流（Google Antigravity / Google AI / Claude / OpenAI / AI 编程 / 其他 AI）
#   3. Google 共享域名三级剥离：
#      - 纯下载/视频域名 (dl/gvt/storage/drive/googlevideo) -> ⬇️ 下载专用 (走大流量节点)
#      - Antigravity & Cloud Code -> 🌌 Google Antigravity
#      - Gemini / AI Studio / NotebookLM / Jules / Vertex -> ✨ Google AI
#      - Google 账号/OAuth/Play区域校验/搜索/API -> 🔍 Google 服务（独立于香港大流量与国内直连，防锁区！）
# ==============================================================================

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24

# 域名嗅探：确保 CLI 工具、Go 进程（如 Antigravity language_server）使用 IP 连接时也能还原域名精准分流
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "localhost"
    - "+.local"

# TUN 模式（兼容 Antigravity IDE / CLI / Claude Code / 终端命令）
# 已显式排除 127.0.0.0/8 回环地址，避免劫持 Antigravity 本地 gRPC / CDP 浏览器调试端口
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  route-exclude-address:
    - 127.0.0.0/8
    - ::1/128

# 防泄露 DNS：开启 respect-rules，使 Google/AI 域名的 DNS 解析也强制走对应代理节点，杜绝国内 DNS 污染与跨区 ECS 泄露
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query

# ==============================================================================
# 机场订阅源（只需将 url 替换为你的订阅地址；若有多个机场可复制新增 provider）
# ==============================================================================
proxy-providers:
  MyAirport:
    type: http
    url: "https://请在此处替换为你的机场订阅链接"
    path: ./proxies/my_airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true

# ==============================================================================
# 策略组设计（AI 精细拆分 + Google 隔离 + 国外/下载统一走大流量）
# ==============================================================================
proxy-groups:
  # 1. 核心出口：国外常规流量 & 大流量节点池
  - name: "📦 大流量节点"
    type: select
    proxies:
      - "⚡ 大流量自动优选"
    include-all: true
    exclude-filter: "(?i)剩余|到期|官网|套餐|重置"

  # 2. 全网下载与大模型权重专用（默认直接走【📦 大流量节点】，也可单独切其他低倍率专线或直连）
  - name: "⬇️ 下载专用"
    type: select
    proxies:
      - "📦 大流量节点"
      - "⚡ 大流量自动优选"
      - "🎯 全球直连"
    include-all: true
    exclude-filter: "(?i)剩余|到期|官网|套餐|重置"

  # 3. Google Antigravity 专属组（自动剔除香港/澳门/俄罗斯等锁区节点）
  - name: "🌌 Google Antigravity"
    type: select
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置"
    proxies:
      - "📦 大流量节点"

  # 4. Google AI 服务组（Gemini / AI Studio / NotebookLM / Jules / Vertex）
  # 默认跟随【🌌 Google Antigravity】保持同 IP 防风控，也可随时独立指定其他节点
  - name: "✨ Google AI"
    type: select
    proxies:
      - "🌌 Google Antigravity"
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置"

  # 5. Google 通用与鉴权隔离组（解决 Google 共享域名掉入香港大流量节点导致 AI 锁区的问题！）
  # 默认跟随【✨ Google AI】，你也可以单独指定任意非香港干净节点（已剥离 YouTube 和 Google 下载到大流量）
  - name: "🔍 Google 服务"
    type: select
    proxies:
      - "✨ Google AI"
      - "🌌 Google Antigravity"
      - "📦 大流量节点"
    include-all: true
    exclude-filter: "(?i)剩余|到期|官网|套餐|重置"

  # 6. Claude (Anthropic / Claude Code) 专属组（对 IP 纯净度要求最高，独立选点）
  - name: "🟠 Claude"
    type: select
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置"
    proxies:
      - "🌌 Google Antigravity"
      - "📦 大流量节点"

  # 7. OpenAI (ChatGPT / Sora / API / 实时语音) 专属组
  - name: "🟢 OpenAI"
    type: select
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置"
    proxies:
      - "🌌 Google Antigravity"
      - "📦 大流量节点"

  # 8. AI 编程助手组（Cursor / Windsurf / GitHub Copilot / JetBrains AI）
  - name: "💻 AI 编程"
    type: select
    proxies:
      - "🌌 Google Antigravity"
      - "🟠 Claude"
      - "🟢 OpenAI"
      - "📦 大流量节点"
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置"

  # 9. 其他海外 AI 平台（Grok / Perplexity / OpenRouter / Poe / Groq / Midjourney 等）
  - name: "🤖 其他 AI"
    type: select
    proxies:
      - "✨ Google AI"
      - "🟢 OpenAI"
      - "🟠 Claude"
      - "📦 大流量节点"
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置"

  # 10. 大流量自动测速优选（自动排除 2x 以上高倍率与家宽节点，挑选最低延迟的大带宽节点）
  - name: "⚡ 大流量自动优选"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
    exclude-filter: "(?i)高倍率|[2-9](\\.\\d+)?[xX倍]|家宽|住宅|原生|剩余|到期|官网|套餐|重置"

  # 11. 国内直连
  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - "📦 大流量节点"

