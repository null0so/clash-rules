# ==============================================================================
# OpenWrt OpenClash (Meta / Mihomo 内核) 专用完整配置文件
# 规则源仓库: https://github.com/null0so/clash-rules (每日自动去重编译 .mrs)
# 用法：将第 58 行 url 替换为你的机场 Clash 订阅链接，上传至 OpenClash【配置文件管理】启用即可
# ==============================================================================

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
external-controller: 0.0.0.0:9090

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "localhost"
    - "+.local"

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query

proxy-providers:
  MyAirport:
    type: http
    url: "https://请在此处替换为你的机场Clash订阅链接"
    path: ./proxy_provider/my_airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true

proxy-groups:
  - name: "大流量节点"
    type: select
    proxies: ["大流量自动优选"]
    include-all: true
    exclude-filter: "(?i)剩余|到期|官网|套餐|重置|群组|频道"

  - name: "下载专用"
    type: select
    proxies: ["大流量节点", "大流量自动优选", "全球直连"]
    include-all: true
    exclude-filter: "(?i)剩余|到期|官网|套餐|重置|群组|频道"

  - name: "Google-Antigravity"
    type: select
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置|群组|频道"
    proxies: ["大流量节点"]

  - name: "Google-AI"
    type: select
    proxies: ["Google-Antigravity"]
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置|群组|频道"

  - name: "Google-服务"
    type: select
    proxies: ["Google-AI", "Google-Antigravity", "大流量节点"]
    include-all: true
    exclude-filter: "(?i)剩余|到期|官网|套餐|重置|群组|频道"

  - name: "AI-Claude"
    type: select
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置|群组|频道"
    proxies: ["Google-Antigravity", "大流量节点"]

  - name: "AI-OpenAI"
    type: select
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置|群组|频道"
    proxies: ["Google-Antigravity", "大流量节点"]

  - name: "AI-编程"
    type: select
    proxies: ["Google-Antigravity", "AI-Claude", "AI-OpenAI", "大流量节点"]
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置|群组|频道"

  - name: "AI-其他"
    type: select
    proxies: ["Google-AI", "AI-OpenAI", "AI-Claude", "大流量节点"]
    include-all: true
    exclude-filter: "(?i)港|HK|Hong\\s?Kong|澳门|MO|Macao|俄|RU|Russia|中国|CN|剩余|到期|官网|套餐|重置|群组|频道"

  - name: "大流量自动优选"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
    exclude-filter: "(?i)高倍率|[2-9](\\.\\d+)?[xX倍]|家宽|住宅|原生|剩余|到期|官网|套餐|重置|群组|频道"

  - name: "全球直连"
    type: select
    proxies: ["DIRECT", "大流量节点"]

rule-providers:
  private_domain: { type: http, behavior: domain, format: mrs, url: "https://testingcf.jsdelivr.net/gh/null0so/clash-rules@main/dist/ruleset/private_domain.mrs", path: ./rule_provider/private_domain.mrs, interval: 86400 }
  private_ip: { type: http, behavior: ipcidr, format: mrs, url: "https://testingcf.jsdelivr.net/gh/null0so/clash-rules@main/dist/ruleset/private_ip.mrs", path: ./rule_provider/private_ip.mrs, interval: 86400 }
  google_antigravity: { type: http, behavior: domain, format: mrs, url: "https://testingcf.jsdelivr.net/gh/null0so/clash-rules@main/dist/ruleset/google_antigravity.mrs", path: ./rule_provider/google_antigravity.mrs, interval: 86400 }
