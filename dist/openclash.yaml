  google_service: { type: http, behavior: domain, format: mrs, url: "https://testingcf.jsdelivr.net/gh/null0so/clash-rules@main/dist/ruleset/google_service.mrs", path: ./rule_provider/google_service.mrs, interval: 86400 }
  google_ip: { type: http, behavior: ipcidr, format: mrs, url: "https://testingcf.jsdelivr.net/gh/null0so/clash-rules@main/dist/ruleset/google_ip.mrs", path: ./rule_provider/google_ip.mrs, interval: 86400 }
